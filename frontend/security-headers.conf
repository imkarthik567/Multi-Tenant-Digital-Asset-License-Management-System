# ==============================================================================
# AssetVault: Production Security Headers & Content Security Policy (CSP)
# Course: BCSE307L Database Systems (Fall 2026-27)
# Included in server block and repeated in every location that uses add_header
# to prevent Nginx add_header inheritance wiping out parent headers
# ==============================================================================

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
