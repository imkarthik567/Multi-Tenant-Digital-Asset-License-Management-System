# ==============================================================================
# AssetVault: Production Nginx Server Configuration
# Features: SPA client-side routing, Gzip, Security Headers, API Reverse Proxy & SSE
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers (Included from external snippet for server block)
    include /etc/nginx/security-headers.conf;

    # Static Assets Caching
    # Note: add_header in child location blocks disables inheritance of parent
    # add_header directives in Nginx. We re-include security-headers.conf here.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;

        # Real-time Server-Sent Events (SSE) support
        proxy_set_header Cache-Control 'no-cache';
        proxy_buffering off;
        chunked_transfer_encoding on;

        # Hide backend headers if present to prevent duplication and apply unified security headers
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/security-headers.conf;
    }

    # SPA Client-Side Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }

    # Healthcheck endpoint
    location /healthz {
        return 200 'healthy';
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
    }
}
