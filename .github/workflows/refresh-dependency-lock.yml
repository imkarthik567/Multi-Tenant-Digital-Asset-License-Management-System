name: One-time dependency lock refresh

on:
  push:
    branches:
      - security/hardening-review-2026-10-15

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening-review-2026-10-15

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh monorepo lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Refresh standalone backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit refreshed lockfiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
            exit 0
          fi
          git commit -m "fix(deps): refresh lockfiles for patched Vitest"
          git push origin HEAD:security/hardening-review-2026-10-15
