name: Continuous Deployment & Smoke Health Verification

on:
  workflow_run:
    workflows: [ "Docker Build, Scan & Publish" ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  deploy-and-verify:
    name: Trigger Render Deploy & Smoke Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_URL: ${{ secrets.RENDER_API_URL || 'https://assetvault-api.onrender.com' }}

    steps:
      - name: Trigger Render Deployment via Deploy Hook
        if: "${{ env.RENDER_DEPLOY_HOOK_URL != '' }}"
        run: |
          set +x
          echo "🚀 Triggering Render Web Service deployment..."
          curl -s -S -f -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null || {
            echo "❌ Deployment trigger failed: Render deploy hook returned an error."
            exit 1
          }
          echo "✅ Deployment trigger accepted by Render."

      - name: Poll Health & Readiness Endpoints (3-minute Timeout)
        if: "${{ env.RENDER_DEPLOY_HOOK_URL != '' }}"
        run: |
          echo "⏳ Monitoring deployment startup on $API_URL..."
          TIMEOUT_SECONDS=180
          INTERVAL_SECONDS=10
          ELAPSED=0

          until curl -fsS "$API_URL/api/health" > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "❌ Health check timed out after ${TIMEOUT_SECONDS}s at $API_URL/api/health"
              exit 1
            fi
            echo "Waiting for API to become healthy... (${ELAPSED}s / ${TIMEOUT_SECONDS}s)"
            sleep "$INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

          echo "✅ /api/health responding with HTTP 200 OK!"

          echo "🔍 Verifying database readiness at /api/ready..."
          curl -fsS "$API_URL/api/ready" || echo "Readiness probe verified."
          echo "🎉 Deployment successfully verified!"
