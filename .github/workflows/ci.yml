name: AssetVault Continuous Integration

on:
  push:
    branches: [ main, dev, frontend, backend ]
  pull_request:
    branches: [ main, dev, frontend, backend ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Security & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: assetvault_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client Types
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Security Gate - Scan for Exposed Secrets
        run: npm run check:secrets

      - name: Security Gate - SQL Injection Static Analysis
        run: npm run check:sqli

      - name: Static Type-Check & Linting
        run: npm run lint

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply Database Migrations, Custom SQL Objects & Seed Data
        env:
          PGPASSWORD: postgrespassword
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
        run: |
          # Use disposable per-run credentials; do not commit shared test passwords.
          export SUPER_ADMIN_EMAIL="ci-superadmin@assetvault.test"
          export SUPER_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export DEFAULT_SEED_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SUPER_ADMIN_PASSWORD"
          echo "::add-mask::$DEFAULT_SEED_PASSWORD"
          echo "SUPER_ADMIN_EMAIL=$SUPER_ADMIN_EMAIL" >> "$GITHUB_ENV"
          echo "SUPER_ADMIN_PASSWORD=$SUPER_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "DEFAULT_SEED_PASSWORD=$DEFAULT_SEED_PASSWORD" >> "$GITHUB_ENV"
          export SEED_DEMO="true"
          npx prisma migrate deploy --schema backend/prisma/schema.prisma
          psql -h localhost -p 5432 -U postgres -d assetvault_test_db -f database/sql/01_views.sql
          psql -h localhost -p 5432 -U postgres -d assetvault_test_db -f database/sql/02_functions_procedures.sql
          psql -h localhost -p 5432 -U postgres -d assetvault_test_db -f database/sql/03_triggers.sql
          psql -h localhost -p 5432 -U postgres -d assetvault_test_db -f database/sql/04_rls.sql
          npx prisma db seed --schema backend/prisma/schema.prisma || npm run db:seed

      - name: Execute Vitest Suite with Code Coverage
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
          JWT_SECRET: test_jwt_access_secret_32_characters_minimum_entropy_1234
          JWT_ACCESS_SECRET: test_jwt_access_secret_32_characters_minimum_entropy_1234
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_32_characters_minimum_entropy_5678
          COOKIE_SECRET: test_cookie_secret_32_characters_minimum_entropy_9012
          CLIENT_URL: http://localhost:5173
          CORS_ORIGIN: http://localhost:5173
        run: npm run test -- --coverage

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Compile Production Database Seed
        run: node node_modules/typescript/bin/tsc -p backend/tsconfig.seed.json

      - name: Production Monorepo Build
        run: npm run build

      # Keep all dependency advisories visible. The current high-severity braces
      # advisory affects braces@3.0.3, a development-only transitive dependency, and
      # has no patched upstream release listed yet. This diagnostic may therefore warn.
      - name: Full Dependency Audit (including development tools)
        if: always()
        continue-on-error: true
        run: npm audit

      # Block releases on high/critical vulnerabilities in runtime dependencies.
      - name: Security Gate - Production Dependency Vulnerability Audit
        if: always()
        run: npm audit --omit=dev --audit-level=high
