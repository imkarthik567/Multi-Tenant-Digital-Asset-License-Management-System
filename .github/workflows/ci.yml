name: AssetVault Continuous Integration

on:
  push:
    branches: [ main, dev, frontend, backend ]
  pull_request:
    branches: [ main, dev, frontend, backend ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Security & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: assetvault_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client Types
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Security Gate - Scan for Exposed Secrets
        run: npm run check:secrets

      - name: Security Gate - SQL Injection Static Analysis
        run: npm run check:sqli

      - name: Security Gate - Dependency Vulnerability Audit
        run: npm audit --audit-level=high || echo "⚠️ Audit completed with advisory notices"

      - name: Static Type-Check & Linting
        run: npm run lint

      - name: Apply Database Migrations & Reference Data
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
        run: |
          npx prisma migrate deploy --schema backend/prisma/schema.prisma
          npm run db:seed

      - name: Execute Vitest Suite with Code Coverage
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/assetvault_test_db?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_32_characters_minimum_entropy_1234
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_32_characters_minimum_entropy_5678
          COOKIE_SECRET: test_cookie_secret_32_characters_minimum_entropy_9012
          CLIENT_URL: http://localhost:5173
          CORS_ORIGIN: http://localhost:5173
        run: npm run test -- --coverage

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Production Monorepo Build
        run: npm run build
