version: '3.8'

# ==============================================================================
# AssetVault: Enterprise Full-Stack Container Orchestration
# Services: PostgreSQL 16 (db), API, Worker (Cron), Web (Nginx SPA), PgAdmin (Tools)
# Configuration: Dynamic substitution from .env (no hardcoded secrets)
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: assetvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-assetvault_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assetvault_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assetvault-network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: assetvault-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production
      # The API uses the restricted role. Direct credentials are used for migrations,
      # bootstrap, seeding, and trusted maintenance jobs only.
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for assetvault_app using host db}
      DIRECT_URL: ${DOCKER_DIRECT_URL:?Set DOCKER_DIRECT_URL for admin maintenance using host db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD to a unique value of at least 32 characters}
      ENABLE_IN_PROCESS_WORKER: "false"
      RUN_WORKER_IN_API: "false"
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      - assetvault-network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: assetvault-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for assetvault_app using host db}
      DIRECT_URL: ${DOCKER_DIRECT_URL:?Set DOCKER_DIRECT_URL for admin maintenance using host db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD to a unique value of at least 32 characters}
      RUN_WORKER: "true"
    entrypoint: ["node", "dist/worker.js"]
    networks:
      - assetvault-network

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: assetvault-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - assetvault-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: assetvault-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@assetvault.internal}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin123!}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - assetvault-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: assetvault-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
    networks:
      - assetvault-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: assetvault-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - assetvault-network

volumes:
  pgdata:
    name: assetvault_pgdata
    driver: local

networks:
  assetvault-network:
    name: assetvault-network
    driver: bridge
